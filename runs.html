<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Проверки — Quantum Security</title><style>
:root { --bg:#03060d; --panel:#0a1222; --panel2:#0e1830; --ink:#e9f1ff; --mute:#8fa0bf; --dim:#5d6c8a;
  --line:rgba(120,170,255,.16); --line2:rgba(120,190,255,.38); --cyan:#35d6ff; --blue:#1e6bff; --red:#ff3352;
  --ok:#3ddc97; --warn:#ffb347; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin:0; background: radial-gradient(1200px 600px at 80% -10%, #0a2a6e33, transparent), var(--bg); color:var(--ink);
  font: 14px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; min-height:100vh; }
a { color: var(--cyan); text-decoration: none; } a:hover { text-decoration: underline; }
.shell { display:grid; grid-template-columns: 232px 1fr; min-height:100vh; }
aside { border-right:1px solid var(--line); padding:22px 14px; position:sticky; top:0; height:100vh; overflow:auto;
  background: rgba(6,12,26,.6); }
.brand { font-weight:300; letter-spacing:.22em; text-transform:uppercase; font-size:15px; padding:0 10px; }
.brand small { display:block; font:10px ui-monospace,Consolas,monospace; letter-spacing:.18em; color:var(--mute); margin-top:4px; }
nav { margin-top:22px; display:flex; flex-direction:column; gap:2px; }
nav a { color:var(--mute); padding:8px 10px; border-radius:8px; font-size:14px; }
nav a:hover { color:var(--ink); background:rgba(120,170,255,.08); text-decoration:none; }
nav a.on { color:var(--ink); background:linear-gradient(90deg, rgba(53,214,255,.16), transparent); box-shadow: inset 2px 0 0 var(--cyan); }
main { padding:26px clamp(16px,3vw,40px) 60px; max-width:1280px; width:100%; min-width:0; }
h1 { font-weight:300; font-size:26px; letter-spacing:.02em; margin:0 0 18px; }
h2 { font-weight:500; font-size:15px; margin:0 0 12px; color:var(--ink); }
.card { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:18px 20px; margin-bottom:18px; }
.grid { display:grid; gap:14px; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); margin-bottom:18px; }
.tile { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px 16px; }
.tile .k { color:var(--mute); font-size:12px; text-transform:uppercase; letter-spacing:.08em; }
.tile .v { font-size:26px; font-weight:300; margin-top:4px; font-variant-numeric: tabular-nums; }
.tile .s { color:var(--mute); font-size:12px; margin-top:2px; }
table { border-collapse:collapse; width:100%; }
th, td { text-align:left; padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
th { color:var(--mute); font-weight:500; font-size:12px; text-transform:uppercase; letter-spacing:.06em; }
tr:last-child td { border-bottom:none; } tbody tr:hover td { background:rgba(120,170,255,.04); }
.tablewrap { overflow-x:auto; }
.muted { color:var(--mute); } .dim { color:var(--dim); }
.ok { color:var(--ok); } .bad { color:var(--red); } .wait { color:var(--warn); }
.mono { font-family: ui-monospace, 'JetBrains Mono', Consolas, monospace; font-size:13px; }
.badge { color:#03060d; border-radius:999px; padding:1px 9px; font-size:12px; white-space:nowrap; font-weight:600; }
.tag { border:1px solid var(--line2); border-radius:999px; padding:1px 9px; font-size:12px; color:var(--ink); white-space:nowrap; }
.tag.ok { border-color:var(--ok); color:var(--ok); } .tag.bad { border-color:var(--red); color:var(--red); }
.tag.wait { border-color:var(--warn); color:var(--warn); } .tag.cy { border-color:var(--cyan); color:var(--cyan); }
button, .btn { font:inherit; font-size:13px; padding:7px 14px; border:1px solid transparent; border-radius:9px;
  background:linear-gradient(180deg,#2b7bff,#1e6bff); color:#fff; cursor:pointer; text-decoration:none; display:inline-block; }
button:hover, .btn:hover { filter:brightness(1.12); text-decoration:none; }
button.ghost, .btn.ghost { background:transparent; border-color:var(--line2); color:var(--ink); }
button.danger { background:transparent; border-color:var(--red); color:var(--red); }
button:disabled { opacity:.4; cursor:not-allowed; }
form.inline { display:inline; }
input, textarea, select { font:inherit; padding:8px 10px; border:1px solid var(--line2); border-radius:9px; width:100%;
  background:#060c1a; color:var(--ink); }
input[type=checkbox] { width:auto; }
textarea { min-height:110px; resize:vertical; font-size:13px; line-height:1.45; }
label { display:block; font-size:12px; margin:12px 0 4px; color:var(--mute); text-transform:uppercase; letter-spacing:.06em; }
.row { display:grid; gap:12px; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); align-items:end; }
.actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; align-items:center; }
.note { border:1px solid rgba(255,179,71,.4); background:rgba(255,179,71,.07); color:#ffd9a0; padding:10px 14px;
  border-radius:12px; font-size:13px; margin-bottom:18px; }
.flash { border:1px solid var(--line2); background:rgba(53,214,255,.08); padding:10px 14px; border-radius:12px; margin-bottom:18px; }
.flash.err { border-color:var(--red); background:rgba(255,51,82,.08); color:#ffc2cc; }
.bar { height:8px; border-radius:999px; background:rgba(120,170,255,.14); overflow:hidden; margin:8px 0 4px; }
.bar i { display:block; height:100%; background:linear-gradient(90deg,var(--blue),var(--cyan)); }
.funnel { display:flex; gap:6px; align-items:stretch; flex-wrap:wrap; }
.funnel div { flex:1; min-width:110px; background:var(--panel2); border:1px solid var(--line); border-radius:12px; padding:10px 12px; }
.funnel b { display:block; font-size:22px; font-weight:300; }
.chat { display:flex; flex-direction:column; gap:8px; }
.chat .m { max-width:78%; padding:8px 12px; border-radius:14px; white-space:pre-wrap; }
.chat .bot { align-self:flex-start; background:#10244d; border:1px solid var(--line2); }
.chat .peer { align-self:flex-end; background:#141c2e; border:1px solid var(--line); }
.chat .sys { align-self:center; color:var(--mute); font-size:12px; }
pre { white-space:pre-wrap; background:#060c1a; border:1px solid var(--line); border-radius:10px; padding:12px; font-size:12.5px; margin:8px 0 0; }
details summary { cursor:pointer; color:var(--cyan); }
.two { display:grid; gap:18px; grid-template-columns: 1fr 1fr; } @media (max-width: 980px) { .two { grid-template-columns:1fr; } }
@media (max-width: 820px) { .shell { grid-template-columns:1fr; } aside { position:static; height:auto; border-right:none;
  border-bottom:1px solid var(--line); padding:14px; } nav { flex-direction:row; overflow-x:auto; margin-top:12px; } nav a { white-space:nowrap; } }
.login { max-width:340px; margin:14vh auto; }
@media (max-width: 820px) { aside { padding:10px 12px 8px !important; } .brand { font-size:13px; } .brand small { display:none; }
  nav { margin-top:8px !important; } nav a { padding:7px 10px; }
  main { padding:14px 12px 40px; } h1 { font-size:21px; } .card { padding:14px; border-radius:12px; }
  th, td { padding:8px 7px; font-size:13px; } button, .btn { padding:10px 14px; font-size:14px; } input, textarea, select { font-size:16px; }
  .card > table, .card > form + table { display:block; overflow-x:auto; } .grid { grid-template-columns:repeat(2, 1fr); gap:8px; }
  .tile .v { font-size:21px; } .funnel div { min-width:92px; } }
html.embed .shell { grid-template-columns: 1fr; } html.embed aside { display:none; } html.embed main { padding-top:18px; }
</style>
