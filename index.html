<script>
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S = null, prev = null, sel = 0, tab = 'live', frame = '', centered = false;
function focusDesk(port) {   // на телефоне сцена шире экрана — подвинуть её так, чтобы стол был по центру
  const stage = $('#stage'), el = $(`.desk[data-port="${port}"] .hit`);
  if (!el || stage.scrollWidth <= stage.clientWidth) return;
  const r = el.getBoundingClientRect(), s = stage.getBoundingClientRect();
  stage.scrollTo({left: stage.scrollLeft + r.left + r.width / 2 - s.left - s.width / 2, behavior: 'smooth'});
}
const OUT = {sms:'согласие на СМС', callback:'перезвон', transfer:'оператору', interested:'интерес', refused:'отказ',
             dnc:'не звонить', wrong_person:'не тот человек', no_dialog:'разговора не было', hangup:'положил трубку'};
const ST = {calling:'набор', talking:'разговор', done:'состоялся', noanswer:'не ответил', busy:'занято', failed:'сбой', stopped:'остановлен'};

async function post(url, data) { alert('Это демо-снимок: действия выполняются в настоящей админке.'); return;
  const body = new URLSearchParams(data || {});
  const r = await fetch(url, {method:'POST', body, headers:{'Content-Type':'application/x-www-form-urlencoded'}});
  const u = new URL(r.url);
  const err = u.searchParams.get('err'), ok = u.searchParams.get('ok');
  if (err) alert(err); else if (!r.ok) alert('Действие не выполнено (' + r.status + ')');
  tick(); return ok;
}
function put(sel, html) { const el = $(sel); if (el.dataset.html !== html) { el.dataset.html = html; el.innerHTML = html; } }
function toast(text) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = text;
  $('#toasts').appendChild(t); setTimeout(() => t.remove(), 5300);
}

function deskState(d) {
  if (!S.service) return ['off', 'служба не запущена'];
  if (!d.sim) return ['off', 'вакансия · вставьте SIM'];
  if (d.error) return ['error', 'сбой порта'];
  if (!d.ready) return ['error', 'нет сети'];
  if (d.call) return d.call.answered ? ['talking', 'в разговоре'] : ['ringing', 'набирает номер'];
  return ['online', S.campaigns.some(c => c.status === 'running') ? (S.in_hours ? 'ждёт звонка' : 'вне часов') : 'на линии'];
}

function events() {   // что изменилось с прошлого опроса — всплывающие уведомления, как в игре
  if (!prev) return;
  for (const d of S.desks) {
    const was = prev.desks.find(x => x.port === d.port);
    if (d.call && !was.call) { toast(`📞 ${d.name} набирает: ${d.call.name}`); focusDesk(d.port); }
    if (d.call && was.call && d.call.answered && !was.call.answered) toast(`🟢 ${d.name}: клиент ответил`);
    if (!d.call && was.call) { const c = d.calls[0];
      toast(c ? `${c.outcome === 'sms' ? '✉️' : c.status === 'done' ? '✅' : '☎️'} ${d.name}: ${OUT[c.outcome] || ST[c.status] || 'звонок окончен'}` : `${d.name}: звонок окончен`); }
  }
  if (S.today.sms > prev.today.sms) toast('✉️ +1 согласие на СМС');
  if (S.today.transfer > prev.today.transfer) toast('🤝 клиент передан оператору');
}

function render() {
  const t = S.today, goal = Math.max(1, S.goal || 30);
  put('#topbar', `<div class="title">Офис</div>
    <div class="goal"><div class="row"><span>План дня: ${t.calls} из ${goal} звонков</span><span>${S.in_hours ? 'рабочие часы' : 'вне часов звонков'}</span></div>
      <div class="track"><i style="width:${Math.min(100, 100 * t.calls / goal)}%"></i></div></div>
    <div class="stat"><div class="ico">✉️</div><div><b>${t.sms}</b><span>согласий</span></div></div>
    <div class="stat"><div class="ico">⭐</div><div><b>${t.score ?? '—'}</b><span>оценка</span></div></div>
    <div class="stat"><div class="ico">💰</div><div><b>$${t.cost.toFixed(2)}</b><span>расход</span></div></div>
    <div class="stat"><div class="ico">${S.operator_online ? '🟢' : '⚪️'}</div><div><b>${S.operator_online ? 'на месте' : 'нет'}</b><span>человек-оператор</span></div></div>`);
  for (const k of ['calls', 'answered', 'sms', 'transfer']) $('#b-' + k).textContent = t[k];
  for (const d of S.desks) {
    const el = $(`.desk[data-port="${d.port}"]`), [cls, label] = deskState(d);
    el.setAttribute('class', 'desk ' + cls + (sel === d.port ? ' sel' : ''));
    $('.status', el).textContent = label;
    $('.name', el).textContent = d.sim ? d.name : 'Свободное место';
    $('.sub', el).textContent = d.sim ? `слот ${d.port}` : `слот ${d.port} · свободно`;
    const b = $(`.say[data-port="${d.port}"]`), last = d.call && d.call.transcript.filter(x => x[1]).slice(-1)[0];
    if (last) { b.textContent = last[1].slice(0, 90) + (last[1].length > 90 ? '…' : ''); b.className = 'say show' + (last[0] === 'bot' ? '' : ' peer'); } else b.className = 'say';
  }
  put('#cards', S.desks.map(d => { const [cls, label] = deskState(d);
    const sub = d.call ? esc(d.call.name) : d.sim ? `звонков ${d.stats.calls} · СМС ${d.stats.sms}` : `слот ${d.port} пуст`;
    return `<button class="ocard ${cls}" onclick="openDesk(${d.port})"><span class="dot"></span><div><b>${esc(d.sim ? d.name : 'Свободное место')}</b><small>${label}</small><em>${sub}</em></div></button>`; }).join(''));
  if (!centered) { centered = true; focusDesk((S.desks.find(d => d.sim) || S.desks[0]).port); }
  const run = S.campaigns.filter(c => c.status === 'running').length, first = (S.desks.find(d => d.sim) || S.desks[0]).port;
  put('#dock',
    `<button onclick="openDesk(${first}, 'control')">▶ Управление обзвоном${run ? ' · идёт ' + run : ''}</button>
     <button class="ghost" onclick="post('/operator/toggle')">${S.operator_online ? 'Я ухожу с линии' : 'Я на линии (принимаю переводы)'}</button>
     <button class="ghost" onclick="openFrame('parse.html', 'Парсинг')">🔎 Парсинг${S.parse ? ' · ' + S.parse.done + '/' + S.parse.total : ''}</button>
     <button class="ghost" onclick="openFrame('analysis.html', 'Анализ и личности')">🧠 Анализ${S.analysis ? ' · ' + S.analysis.done + '/' + S.analysis.total : ''}</button>
     <button class="ghost" onclick="openFrame('analytics.html', 'Аналитика')">📈 Итоги</button>`);
  if (sel && !frame) renderDrawer();
}

function openDesk(port, t) { sel = port; tab = t || (S.desks.find(d => d.port === port).call ? 'live' : 'today'); frame = '';
  $('#drawer').classList.remove('wide'); show(); renderDrawer(true); render(); }
function openFrame(url, title) { sel = 0; frame = url; $('#dtitle').textContent = title; $('#dtabs').innerHTML = '';
  $('#dbody').outerHTML = `<iframe id="dbody" src="${url}"></iframe>`; $('#drawer').classList.add('wide'); show(); }
function show() { $('#drawer').classList.add('open'); $('#veil').classList.add('on'); }
function hide() { $('#drawer').classList.remove('open'); $('#veil').classList.remove('on'); sel = 0; frame = ''; if (S) render(); }

function renderDrawer(force) {
  const d = S.desks.find(x => x.port === sel); if (!d) return;
  if ($('#dbody').tagName === 'IFRAME') $('#dbody').outerHTML = '<div class="body" id="dbody"></div>';
  const [cls, label] = deskState(d);
  $('#dtitle').innerHTML = `${esc(d.sim ? d.name : 'Свободное место')} · слот ${d.port} <span class="tag ${cls === 'online' ? 'ok' : cls === 'talking' ? 'cy' : cls === 'ringing' ? 'wait' : cls === 'error' ? 'bad' : ''}">${label}</span>`;
  const body = $('#dbody');
  if (!d.sim) { $('#dtabs').innerHTML = '';
    body.innerHTML = `<p>За этим столом пока никто не работает: в слоте ${d.port} шлюза нет SIM-карты.</p>
      <p class="muted">Вставьте SIM в слот ${d.port} при выключенном шлюзе — оператор появится за столом сам.</p>`; return; }
  $('#dtabs').innerHTML = [['live', 'Вживую'], ['today', 'Сегодня'], ['control', 'Управление']].map(([k, l]) =>
    `<button class="${tab === k ? 'on' : ''}" onclick="tab='${k}';renderDrawer(true)">${l}</button>`).join('');
  if (tab === 'live') {
    const c = d.call;
    if (!c) { body.innerHTML = '<p class="muted">Сейчас разговора нет. Когда оператор наберёт номер, здесь пойдёт разговор вживую.</p>'; body.dataset.tab = tab; return; }
    const typing = document.activeElement && document.activeElement.id === 'hint';
    const chat = `<div class="chat">` + c.transcript.filter(x => x[1]).map(x => `<div class="m ${x[0] === 'bot' ? 'bot' : 'peer'}">${esc(x[1])}</div>`).join('') + `</div>`;
    if (typing && !force && $('#livechat')) { $('#livechat').innerHTML = chat; return; }
    body.innerHTML = `<p><b>${esc(c.name)}</b> <span class="muted mono">${esc(c.number)}</span> ${c.kind === 'test' ? '<span class="tag">тест</span>' : ''}</p>
      <div id="livechat">${chat}</div>
      <div class="row2"><input id="hint" placeholder="Подсказать ИИ: что сказать клиенту сейчас">
        <button class="ghost" onclick="post('/calls/${c.id}/hint', {text: $('#hint').value}).then(() => $('#hint').value = '')">Подсказать</button></div>
      <div class="row2"><button class="ghost" onclick="listenCall(${c.id}, this)">${typeof listenWs !== 'undefined' && listenWs ? '⏹ Не слушать' : '🎧 Слушать'}</button>
        <button onclick="confirm('Забрать разговор на софтфон?') && post('/calls/${c.id}/take')">☎ Забрать звонок себе</button>
        <button class="danger" onclick="post('/calls/${c.id}/stop')">Положить трубку</button>
        <a class="btn ghost" href="#" target="_blank">Открыть звонок</a></div>`;
    body.scrollTop = body.scrollHeight;
  } else if (tab === 'today') {
    const s = d.stats;
    body.innerHTML = `<div class="grid" style="grid-template-columns:repeat(4,1fr)">
        <div class="tile"><div class="k">звонков</div><div class="v">${s.calls}</div></div>
        <div class="tile"><div class="k">разговоров</div><div class="v">${s.answered}</div></div>
        <div class="tile"><div class="k">СМС</div><div class="v">${s.sms}</div></div>
        <div class="tile"><div class="k">оценка</div><div class="v">${s.score ?? '—'}</div></div></div>
      <div class="calls-today">` + (d.calls.length ? d.calls.map(c =>
        `<a class="item" href="#" onclick="event.preventDefault();openFrame('call.html','Звонок #${c.id}')">
           <b>${esc(c.name || '—')}</b> ${c.kind === 'test' ? '<span class="tag">тест</span>' : ''}
           <span class="tag ${c.status === 'done' ? 'ok' : c.status === 'failed' ? 'bad' : ''}">${ST[c.status] || c.status}</span>
           ${c.outcome ? '<span class="tag cy">' + (OUT[c.outcome] || c.outcome) + '</span>' : ''}
           ${c.score != null ? '<span class="tag">оценка ' + c.score + '</span>' : ''}
           <div class="t">${esc(c.time)} · ${esc(c.summary || c.reason || '')}</div></a>`).join('')
        : '<p class="muted">Сегодня этот оператор ещё не звонил.</p>') + `</div>`;
  } else {
    if (!force && body.dataset.tab === 'control') return;   // не перерисовывать под рукой
    const camps = S.campaigns.map(c => `<div class="card" style="padding:12px 14px;margin-bottom:10px">
        <b>${esc(c.name)}</b> <span class="tag ${c.status === 'running' ? 'ok' : c.status === 'paused' ? 'wait' : ''}">${{draft:'черновик',running:'идёт',paused:'пауза',done:'завершена'}[c.status]}</span>
        <div class="muted">в очереди ${c.left} · звонков ${c.calls} · СМС ${c.sms} ${esc(c.note || '')}</div>
        <div class="row2">${c.status === 'running'
          ? `<button class="ghost" onclick="post('/campaigns/${c.id}/pause').then(() => renderDrawer(true))">⏸ Пауза</button>`
          : `<button onclick="confirm('Запустить боевой обзвон? ИИ начнёт звонить на реальные номера.') && post('/campaigns/${c.id}/start').then(() => renderDrawer(true))">▶ Старт</button>`}
          <button class="ghost" onclick="openFrame('campaign.html', 'Кампания')">Открыть</button></div></div>`).join('')
      || '<p class="muted">Кампаний пока нет.</p>';
    body.innerHTML = `<h2>Кампании</h2>${camps}
      <button class="ghost" onclick="openFrame('campaigns.html', 'Кампании')">＋ Новая кампания</button>
      <h2 style="margin-top:22px">Тестовый звонок</h2>
      <p class="muted">Оператор позвонит вам и проведёт разговор как с выбранным бизнесом.</p>
      <div class="row2"><select id="tb">${S.testable.map(b => `<option value="${b.id}">${esc(b.name)}</option>`).join('')}</select></div>
      <div class="row2"><button onclick="post('/b/' + $('#tb').value + '/call', {kind:'test', number: S.test_number}).then(() => { tab='live'; renderDrawer(true); })" ${S.test_number ? '' : 'disabled'}>📱 Позвонить мне${S.test_number ? ' на ' + esc(S.test_number) : ' (номер не задан)'}</button>
        <button class="ghost" onclick="post('/b/' + $('#tb').value + '/call', {kind:'test'}).then(() => { tab='live'; renderDrawer(true); })">☎ На софтфон</button></div>`;
  }
  body.dataset.tab = tab;
}

async function tick() {
  try { const next = await (await fetch('api_floor.json')).json(); prev = S; S = next; events(); render(); } catch (e) {}
}
$$('.desk').forEach(el => { el.addEventListener('click', () => S && openDesk(+el.dataset.port));
  el.addEventListener('keydown', e => (e.key === 'Enter' || e.key === ' ') && S && openDesk(+el.dataset.port)); });
$('#dclose').onclick = hide; $('#veil').onclick = hide;
document.addEventListener('keydown', e => e.key === 'Escape' && hide());
// боковое меню открывает разделы в панели — страница остаётся одна
$$('aside nav a').forEach(a => { if (a.getAttribute('href') !== 'index.html') a.addEventListener('click', e => {
  e.preventDefault(); openFrame(a.getAttribute('href'), a.textContent); }); });
function clock() { const n = new Date(), h = n.getHours() % 12 + n.getMinutes() / 60, m = n.getMinutes();
  $('#hh').setAttribute('transform', `rotate(${h * 30} 26 26)`); $('#mh').setAttribute('transform', `rotate(${m * 6} 26 26)`); }
clock(); setInterval(clock, 20000);
tick(); setInterval(tick, 1500);
</script><script>
// прослушивание звонка: сервер шлёт кадры по 20 мс (первый байт — сторона: 0 клиент, 1 ИИ), обе стороны играются разом
let listenWs = null, listenCtx = null;
function listenCall(id, btn) {
  if (listenWs) { listenWs.close(); listenWs = null; if (btn) btn.textContent = '🎧 Слушать'; return; }
  listenCtx = listenCtx || new (window.AudioContext || window.webkitAudioContext)();
  listenCtx.resume();
  const next = [0, 0];
  listenWs = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/calls/' + id + '/audio');
  listenWs.binaryType = 'arraybuffer';
  if (btn) btn.textContent = '⏹ Не слушать';
  listenWs.onmessage = e => {
    const bytes = new Uint8Array(e.data), side = bytes[0];
    const pcm = new Int16Array(e.data.slice(1)), buf = listenCtx.createBuffer(1, pcm.length, 8000), ch = buf.getChannelData(0);
    for (let i = 0; i < pcm.length; i++) ch[i] = pcm[i] / 32768;
    const src = listenCtx.createBufferSource(); src.buffer = buf; src.connect(listenCtx.destination);
    next[side] = Math.max(listenCtx.currentTime + 0.12, next[side]); src.start(next[side]); next[side] += buf.duration;
  };
  listenWs.onclose = () => { listenWs = null; if (btn) btn.textContent = '🎧 Слушать'; };
}
</script></main>
